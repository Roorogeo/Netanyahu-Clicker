<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icon renderer</title>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.min.js" } }
  </script>
  <style>body { margin: 0; background: #888; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
  // Renders each 3D model in js/models.js to a transparent square PNG.
  // Driven by tools/render-icons.cjs; also usable by hand: renderIcon("falafel").
  import * as THREE from "three";
  import { RoomEnvironment } from "../vendor/three/addons/RoomEnvironment.js";
  import { MODELS, makeModel, animateModel } from "../js/models.js";

  const SIZE = 256;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(SIZE, SIZE);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899bb, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(3, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xbfd2ff, 1.2); rim.position.set(-4, 2, -3); scene.add(rim);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);

  // Camera angles per model (default is a 3/4 view from above)
  const VIEW = {
    default: [0.55, 0.42, 1], star: [0.15, 0.08, 1], starSilver: [0.15, 0.08, 1], starBlue: [0.15, 0.08, 1],
    starRuby: [0.15, 0.08, 1], starPurple: [0.15, 0.08, 1], heart: [0.2, 0.1, 1], medal: [0.2, 0.1, 1],
    medalSilver: [0.2, 0.1, 1], medalBronze: [0.2, 0.1, 1], clock: [0.2, 0.12, 1], scroll: [0.25, 0.1, 1],
    fireworks: [0.1, 0.05, 1], hand: [0.25, 0.15, 1], thumb: [0.45, 0.15, 1], handshake: [0.2, 0.2, 1],
    newspaper: [0.3, 0.35, 1], baby: [0.3, 0.15, 1], mic: [0.4, 0.2, 1],
    megaphone: [0.3, 0.15, 1], bulb: [0.25, 0.15, 1], walls: [0.35, 0.18, 1], cactus: [0.3, 0.15, 1],
    crown: [0.4, 0.45, 1], hummus: [0.35, 0.75, 1], satellite: [0.45, 0.8, 1], spa: [0.45, 0.75, 1], tv: [0.45, 0.2, 1], warroom: [0.35, 0.15, 1], billboard: [0.45, 0.15, 1],
  };

  window.renderIcon = (name) => {
    const model = makeModel(name);
    animateModel(model, 0.6, 0);
    scene.add(model);
    const boxB = new THREE.Box3().setFromObject(model);
    const sphere = boxB.getBoundingSphere(new THREE.Sphere());
    const dir = new THREE.Vector3(...(VIEW[name] || VIEW.default)).normalize();
    const dist = sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.02;
    camera.position.copy(sphere.center).addScaledVector(dir, dist);
    camera.lookAt(sphere.center);
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL("image/png");
    scene.remove(model);
    return url;
  };
  window.iconNames = Object.keys(MODELS);
  window.iconsReady = true;
</script>
</body>
</html>
